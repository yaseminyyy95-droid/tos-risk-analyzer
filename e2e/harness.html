<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToS Risk Analyzer — E2E Harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  .harness { display: grid; grid-template-columns: 1fr 440px; height: 100vh; }
  .harness iframe { width: 100%; height: 100%; border: 0; border-right: 3px solid #2b59c3; }
  #app { height: 100vh; overflow: auto; }
  .label { position: fixed; left: 8px; bottom: 8px; background: #2b59c3; color: #fff; font: 12px sans-serif; padding: 2px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="harness">
  <iframe id="page" title="Analiz edilen sayfa"></iframe>
  <div id="app"></div>
</div>
<span class="label">E2E harness: sol = web sayfası (iframe), sağ = gerçek side panel</span>
<script type="module" src="./harness.tsx"></script>
</body>
</html>
