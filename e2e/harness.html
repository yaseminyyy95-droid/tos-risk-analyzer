<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToS Risk Analyzer — E2E Harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  .harness { display: grid; grid-template-columns: 1fr 440px; height: 100vh; }
  .harness iframe { width: 100%; height: 100%; border: 0; border-right: 3px solid #2b59c3; }
  #app { height: 100vh; overflow: auto; }
  .title-card { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: #1f2937; color: #fff; font: 600 40px/1.3 system-ui, sans-serif; transition: opacity 0.4s ease; text-align: center; }
  .title-card small { font-size: 20px; font-weight: 400; opacity: 0.85; margin-top: 12px; }
  .title-card.hidden { opacity: 0; pointer-events: none; }
  .label { position: fixed; left: 8px; bottom: 8px; background: #2b59c3; color: #fff; font: 12px sans-serif; padding: 2px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="harness">
  <iframe id="page" title="Analiz edilen sayfa"></iframe>
  <div id="app"></div>
</div>
<div class="title-card hidden" id="title-card" data-cy="title-card" aria-hidden="true"></div>
<span class="label">E2E harness: sol = web sayfası (iframe), sağ = gerçek side panel</span>
<script type="module" src="./harness.tsx"></script>
</body>
</html>
